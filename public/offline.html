<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>Sehaty - لا يوجد اتصال</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f3f8fa; color: #123044; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 520px); text-align: center; background: #fff; border: 1px solid #d8e7eb; border-radius: 24px; padding: 36px 24px; box-shadow: 0 16px 40px #12304414; }
    .icon { margin: 0 auto 18px; width: 72px; height: 72px; display: grid; place-items: center; border-radius: 22px; background: #dff7f3; color: #0f766e; font-size: 34px; }
    h1 { margin: 0 0 12px; font-size: 28px; } p { line-height: 1.8; color: #54707b; } button { margin-top: 14px; border: 0; border-radius: 12px; padding: 12px 22px; background: #0f766e; color: white; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body><main><div class="icon">⌁</div><h1>لا يوجد اتصال حاليًا</h1><p>يمكنك متابعة الصفحات التي تم تحميلها مسبقًا. عند عودة الاتصال، اضغط إعادة المحاولة للوصول إلى الحسابات والبيانات الطبية.</p><button onclick="location.reload()">إعادة المحاولة</button></main></body>
</html>
