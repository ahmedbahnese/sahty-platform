name: Sehaty CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    name: Backend tests and security regressions
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: development
      SESSION_SECRET: ci-only-secret
      DATABASE_URL: sqlite:////tmp/sehaty-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Shell syntax checks
        run: bash -n scripts/*.sh
      - name: Compile Python sources
        run: python -m compileall -q main.py src scripts
      - name: Backend test suite
        run: python -m pytest -q

  web:
    name: Web lint and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  container:
    name: Portable runtime configuration
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose when Docker is available
        run: docker compose -f compose.yaml config
      - name: Build portable image
        run: docker build --tag sehaty-ci:${{ github.sha }} .

  security:
    name: Dependency and secret checks
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript,python
      - uses: github/codeql-action/analyze@v3

  staging-gate:
    name: Staging promotion gate
    runs-on: ubuntu-latest
    needs: [backend, web, container, security]
    environment: staging
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Require an explicit staging deployment URL
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: test -n "$STAGING_BASE_URL"
      - name: Verify staging health and readiness
        env:
          STAGING_BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          curl --fail --silent --show-error "$STAGING_BASE_URL/healthz"
          curl --fail --silent --show-error "$STAGING_BASE_URL/readyz"
      # The provider-specific deployment step must be added by the hosting owner.
      # This job intentionally refuses to invent a deployment API or token.
