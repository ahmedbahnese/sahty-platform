services:
  - type: web
    name: sahty-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app main db upgrade && gunicorn --bind 0.0.0.0:$PORT wsgi:application
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true